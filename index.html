<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MégaOctets, la tech expliquée simplement</title>
<meta name="description" content="Le podcast qui répond à une question tech par épisode, en dix minutes, sans jargon.">
<meta property="og:title" content="MégaOctets">
<meta property="og:description" content="La tech expliquée simplement. Écoutez sur Spotify, Apple Podcasts, Deezer ou Pocket Casts.">
<meta property="og:image" content="pochette.jpg">
<link rel="icon" href="pochette.jpg">
<style>
  :root { --nuit:#0A1020; --nuit2:#14213D; --ambre:#FFC24B; --orange:#FF7A45; --texte:#E8ECF4; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:linear-gradient(160deg,var(--nuit2),var(--nuit)); color:var(--texte);
         font-family:Inter,Manrope,system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { width:100%; max-width:420px; padding:32px 20px; text-align:center; }
  img { width:220px; height:220px; border-radius:20px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  h1 { margin:24px 0 6px; font-size:28px; }
  p { margin:0 0 28px; opacity:.85; }
  a.btn { display:block; margin:12px 0; padding:14px 18px; border-radius:12px; text-decoration:none;
          font-weight:600; font-size:17px; color:var(--nuit);
          background:linear-gradient(90deg,var(--ambre),var(--orange)); transition:transform .1s; }
  a.btn:hover, a.btn:focus-visible { transform:scale(1.02); outline:2px solid var(--texte); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <img src="pochette.jpg" alt="Pochette du podcast MégaOctets">
  <h1>MégaOctets</h1>
  <p>La tech expliquée simplement. Une question par épisode, dix minutes, zéro jargon.</p>
  <a class="btn" href="https://open.spotify.com/show/5Ef7nfCpUXAcL7hqaJxZgh">Écouter sur Spotify</a>
  <a class="btn" href="https://podcasts.apple.com/fr/podcast/m%C3%A9gaoctets/id6819363666">Écouter sur Apple Podcasts</a>
  <a class="btn" href="https://www.deezer.com/show/1003641932">Écouter sur Deezer</a>
  <a class="btn" href="https://pocketcasts.com/podcast/m%C3%A9gaoctets/c20c8fb0-a32d-013f-2d9b-02ffd80f4ca1">Écouter sur Pocket Casts</a>
</main>
</body>
</html>
